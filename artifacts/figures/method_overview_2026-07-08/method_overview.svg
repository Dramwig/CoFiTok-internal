<text x="1550.0" y="663" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">dense</text>
<text x="1550.0" y="687" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">component</text>
<rect x="805" y="750" width="380" height="125" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="3" />
<text x="995.0" y="784" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#111827">Prefix sum</text>
<text x="995.0" y="818" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">eps_hat_1:m = sum_{k&lt;=m} S_k(z_k)</text>
<text x="995.0" y="842" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">valid partial noise prediction</text>
<rect x="1305" y="750" width="360" height="125" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="3" />
<text x="1485.0" y="784" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#111827">Full sum</text>
<text x="1485.0" y="818" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">eps_hat = sum_{k&lt;=K} S_k(z_k)</text>
<text x="1485.0" y="842" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">standard reverse update</text>
<rect x="805" y="920" width="380" height="110" rx="16" fill="#ecfdf5" stroke="#059669" stroke-width="3" />
<text x="995.0" y="954" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#111827">Partial denoising</text>
<text x="995.0" y="988" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">x0_hat^m from eps_hat_1:m</text>
<text x="995.0" y="1012" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">prefix-controllable result</text>
<rect x="1305" y="920" width="360" height="110" rx="16" fill="#eef2ff" stroke="#4f46e5" stroke-width="3" />
<text x="1485.0" y="954" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#111827">Final denoising</text>
<text x="1485.0" y="988" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">x0_hat^K from eps_hat</text>
<text x="1485.0" y="1012" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">pixel-space output</text>
<rect x="70" y="825" width="660" height="195" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="3" />
<text x="400.0" y="859" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="23" font-weight="700" fill="#111827">Default S_k restrictions</text>
<text x="400.0" y="893" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">sees only current z_k</text>
<text x="400.0" y="917" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">no x_t, t, label, prompt, z_&lt;k, skips, or constants</text>
<text x="400.0" y="941" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">bias-free shallow local synthesis; S_k(0)=0</text>
<text x="400.0" y="965" text-anchor="middle" font-family="Arial, DejaVu Sans, sans-serif" font-size="16" fill="#374151">tokens are noise components, not VAE image latents</text>
</svg>
