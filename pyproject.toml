[project]
name = "cofitok"
version = "0.1.0"
description = "CoFiTok: coarse-to-fine denoising token factorization for pixel-space diffusion."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.1",
  "torchvision>=0.16",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
quality = [
  "lpips==0.1.4",
  "scipy>=1.15",
]
official-fid = [
  "pytorch-fid>=0.3.0",
]
generation-eval = [
  "pytorch-fid>=0.3.0",
  "torch-fidelity>=0.4.0,<0.5",
]
plotting = [
  "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cofitok"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
